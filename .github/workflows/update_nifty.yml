name: Daily NIFTY engine (v5) - data, model, research report, GitHub Pages

# Replaces the legacy v3 job (which retrained a leaky model and committed data to the repo).
# This job never commits: data lives in the Actions cache, reports go to GitHub Pages and to the
# run's artifacts. It does not run on push, so pushing to main never triggers it.
on:
  schedule:
    - cron: '0 12 * * 1-5'    # 17:30 IST, after the NSE close and the 17:00 data settle
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "daily-engine"
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NE_DATA_DIR: ${{ github.workspace }}/store
      NE_USE_ZOO: "false"          # the full model zoo runs on your Mac (`python -m nifty_engine zoo`)
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: 'pip' }
      - run: pip install -r requirements-engine.txt

      # Hourly overnight-futures bars only go back ~2 years on Yahoo, so history is kept here
      # and grows a little every day.
      - name: Restore market data
        uses: actions/cache/restore@v4
        with:
          path: |
            store/raw
            store/raw_1h
          key: engine-data-${{ github.run_id }}
          restore-keys: engine-data-

      - name: Unit + leakage tests
        run: python -m unittest discover -s tests -v
      - name: Refresh data (daily + hourly global markets)
        run: python -m nifty_engine update-data
      - name: Walk-forward train + backtest
        run: |
          python -m nifty_engine train
          python -m nifty_engine backtest
      - name: Research report (free data only; options/intraday/LLM experiments run on your Mac)
        run: python -m nifty_engine research --quick

      - name: Save market data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            store/raw
            store/raw_1h
          key: engine-data-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-reports
          path: |
            store/reports/
            store/models/champion.json

      - name: Build site
        run: python scripts/build_site.py store/reports site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
