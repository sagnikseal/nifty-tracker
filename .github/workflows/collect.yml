name: Collect Upstox data + news

# Off by default: set the repository variable COLLECT_ENABLED=true to turn this on.
# If this repository is PUBLIC, first point DATA_REPO at a PRIVATE repository and set
# DATA_REPO_TOKEN (a token with Contents read/write there) -- Upstox/NSE data should not be
# redistributed publicly. See docs/DATA_COLLECTION.md.
#
# Every run: checks out the data branch as it was left by the last run, appends new rows with
# the engine's own commands (each is incremental/resumable on its own), and pushes. That
# "checkout last state, then only append" is the merge: nothing is re-fetched or overwritten.

on:
  schedule:
    - cron: '*/15 3-10 * * 1-5'   # every 15 min, ~08:30-16:00 IST, Mon-Fri (IST = UTC+5:30)
  workflow_dispatch:

concurrency:
  group: collect-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    if: ${{ vars.COLLECT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
      DATA_REPO: ${{ vars.DATA_REPO || github.repository }}
      NE_DATA_DIR: ${{ github.workspace }}/data-store/store
    steps:
      - name: Check out the engine code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      - name: Check out the data branch (create it on first run)
        env:
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN || github.token }}
        run: |
          set -e
          URL="https://x-access-token:${DATA_TOKEN}@github.com/${DATA_REPO}.git"
          if git clone --branch data --single-branch --depth 1 "$URL" data-store 2>/dev/null; then
            echo "checked out existing data branch"
          else
            git clone --depth 1 "$URL" data-store
            cd data-store
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
            git commit --allow-empty -m "data: start the branch"
          fi
          mkdir -p data-store/store

      - name: Option-chain snapshot
        if: ${{ env.UPSTOX_ANALYTICS_TOKEN != '' }}
        run: python -m nifty_engine chain-poll

      - name: Intraday candles top-up
        if: ${{ env.UPSTOX_ANALYTICS_TOKEN != '' }}
        run: python -m nifty_engine refresh-intraday

      - name: Bank Nifty / heavyweights / NIFTY futures top-up
        if: ${{ env.UPSTOX_ANALYTICS_TOKEN != '' }}
        run: python -m nifty_engine fetch-history

      - name: News capture (free; no token needed)
        run: python -m nifty_engine news-capture

      - name: Commit and push
        if: ${{ !cancelled() }}
        working-directory: data-store
        env:
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN || github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          URL="https://x-access-token:${DATA_TOKEN}@github.com/${DATA_REPO}.git"
          for i in 1 2 3; do
            if git push "$URL" HEAD:data; then
              exit 0
            fi
            git fetch "$URL" data
            git rebase FETCH_HEAD
          done
          echo "push failed after 3 attempts" >&2
          exit 1
