name: Collect market data (snapshots + news)

# Collects data that cannot be downloaded later and stores it on the orphan `data` branch (never on
# main). Pull it to the Mac with `python -m nifty_engine.collect sync`. See docs/DATA_COLLECTION.md.
#
# GitHub cron is UTC and runs can start 5-30 min late; the collector records the actual time,
# skips snapshots outside 09:15-15:45 IST and on holidays (stale last-trade time), and always polls
# the free news feeds. Minutes are offset from :00/:15/:30/:45 because GitHub is busiest on the hour.
on:
  schedule:
    # snapshot = option chains (nearest 2 expiries) + quotes with depth + news; Mon-Fri every 15 min
    - cron: '46 3 * * 1-5'               # 09:16 IST
    - cron: '1,16,31,46 4-9 * * 1-5'     # 09:31 ... 15:16 IST
    - cron: '1 10 * * 1-5'               # 15:31 IST (closing chain)
    # news only, every 15 min whenever the snapshot job is not running
    - cron: '7,22,37,52 0-3,10-23 * * 1-5'   # weekdays 05:37-09:22 and 15:37-05:22 IST
    - cron: '7,22,37,52 * * * 0,6'           # weekends (UTC days), around the clock
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to collect'
        type: choice
        options: [snapshot, news]
        default: snapshot
      force:
        description: 'Collect market data even outside market hours / on stale quotes'
        type: boolean
        default: false

permissions:
  contents: write

# One writer of the data branch at a time (shared with collect_eod.yml). Runs queue, never cancel.
concurrency:
  group: data-branch-writer
  cancel-in-progress: false

jobs:
  collect:
    # Off until you opt in (repo Settings > Variables: COLLECT_ENABLED=true). If this repository is public,
    # also set DATA_REPO to a PRIVATE repo: Upstox/NSE data may not be redistributed publicly.
    if: ${{ vars.COLLECT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: '1'
      NE_DATA_DIR: ${{ github.workspace }}/.store     # scratch store (instrument master cache)
      DATA_REPO: ${{ vars.DATA_REPO || github.repository }}
      DATA_DIR_PATH: databranch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install collector dependencies (numpy, pandas, requests only)
        run: pip install --disable-pip-version-check -q "numpy>=1.26" "pandas>=2.1" "requests>=2.31"

      - name: Choose mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            mode="${INPUT_MODE:-snapshot}"
          else
            case "$SCHEDULE" in
              '7,22,37,52 '*) mode=news ;;
              *) mode=snapshot ;;
            esac
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "mode: $mode (event: $EVENT, schedule: ${SCHEDULE:-none}, now: $(date '+%F %H:%M %Z'))"

      - name: Check out the data branch (sparse, last 6 days)
        env:
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN || github.token }}
        run: bash nifty_engine/collect/gha.sh checkout

      - name: Collect
        env:
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: >-
          python -m nifty_engine.collect ${{ steps.mode.outputs.mode }}
          --out "$RUNNER_TEMP/staging" --data-branch-dir "$DATA_DIR_PATH" $FORCE

      - name: Commit and push to the data branch
        if: ${{ !cancelled() }}
        env:
          DATA_TOKEN: ${{ secrets.DATA_REPO_TOKEN || github.token }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: STAGING="$RUNNER_TEMP/staging" bash nifty_engine/collect/gha.sh push
